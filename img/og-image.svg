<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06290e" />
      <stop offset="40%" stop-color="#094017" />
      <stop offset="75%" stop-color="#002776" />
      <stop offset="100%" stop-color="#020e05" />
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#eab308" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Diagonal Stripe Accent -->
  <path d="M -100,630 L 500,0 L 580,0 L -20,630 Z" fill="rgba(34, 197, 94, 0.15)" />
  <path d="M 700,630 L 1300,0 L 1380,0 L 780,630 Z" fill="rgba(234, 179, 8, 0.12)" />

  <!-- Floating 22 Background Text -->
  <text x="100" y="220" font-family="'Outfit', sans-serif" font-weight="900" font-size="160" fill="rgba(255,255,255,0.03)">22</text>
  <text x="900" y="550" font-family="'Outfit', sans-serif" font-weight="900" font-size="180" fill="rgba(255,255,255,0.03)">22</text>

  <!-- Main Card Container -->
  <rect x="80" y="60" width="1040" height="510" rx="32" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" filter="url(#shadow)" />

  <!-- Logo Shield Emblem -->
  <g transform="translate(140, 115)">
    <path d="M50 6 L85 21 C85 60 50 91 50 94 C50 91 15 60 15 21 Z" fill="#22c55e" />
    <polygon points="50,17 76,47 50,77 24,47" fill="#eab308" />
    <circle cx="50" cy="47" r="18" fill="#1d4ed8" />
    <text x="50" y="53" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">22</text>
  </g>

  <!-- Title "PÁTRIA 22" -->
  <text x="260" y="180" font-family="'Outfit', sans-serif" font-weight="900" font-size="64" fill="url(#goldText)" filter="url(#glow)">PÁTRIA 22</text>
  <text x="560" y="180" font-family="'Outfit', sans-serif" font-weight="800" font-size="44" fill="#ffffff">🇧🇷🚀</text>

  <!-- Tagline -->
  <text x="140" y="270" font-family="'Outfit', sans-serif" font-weight="900" font-size="52" fill="#ffffff">Gerador de Artes de Apoio</text>
  <text x="140" y="340" font-family="'Outfit', sans-serif" font-weight="900" font-size="58" fill="url(#goldText)">FLÁVIO BOLSONARO 2026</text>

  <!-- Feature Bullet Badges -->
  <g transform="translate(140, 410)">
    <rect x="0" y="0" width="240" height="48" rx="14" fill="rgba(34, 197, 94, 0.2)" stroke="#22c55e" stroke-width="1.5" />
    <text x="120" y="31" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="#22c55e" text-anchor="middle">🖼️ Feed &amp; Stories</text>

    <rect x="260" y="0" width="240" height="48" rx="14" fill="rgba(234, 179, 8, 0.2)" stroke="#eab308" stroke-width="1.5" />
    <text x="380" y="31" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="#facc15" text-anchor="middle">🛡️ Selos de Perfil</text>

    <rect x="520" y="0" width="260" height="48" rx="14" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1.5" />
    <text x="650" y="31" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="#60a5fa" text-anchor="middle">🌵 Apoio ao Nordeste</text>
  </g>

  <!-- Footer Credit inside card -->
  <text x="140" y="515" font-family="'Outfit', sans-serif" font-weight="700" font-size="20" fill="rgba(255,255,255,0.7)">Desenvolvido por Moacir David | moacirdavidag.com</text>
</svg>